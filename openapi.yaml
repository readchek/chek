openapi: 3.1.0
info:
  title: Chek server API
  version: 0.1.0
  description: |
    The contract between the Chek server and its clients. This file is written
    by hand and is the source of truth: change it in the same pull request as
    the server code, and clients generate their code from a tagged release.

    Every operation except `/health`, `/api/v1/setup` and sign-in needs a
    session token from sign-in, sent as `Authorization: Bearer <token>`.
    Admins see every library; readers see only the libraries they were granted,
    and other libraries and their publications answer as not found.
servers:
  - url: http://localhost:8080
security:
  - session: []
tags:
  - name: Health
    description: Whether the server is up.
  - name: Accounts
    description: Setup, sign-in and user management.
  - name: Libraries
    description: Folders and sources the server reads publications from.
  - name: Catalog
    description: Series and publications found in libraries.
  - name: Reading
    description: Files, pages and covers.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the server is running
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/setup:
    post:
      tags: [Accounts]
      operationId: setUp
      summary: Create the first admin
      description: |
        Works only while the server has no accounts. The setup token is printed
        in the server's log at startup, so only someone who can read the log
        can claim the server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setupToken, name, password]
              properties:
                setupToken:
                  type: string
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "201":
          description: The admin was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The server already has an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-in:
    post:
      tags: [Accounts]
      operationId: signIn
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password]
              properties:
                name:
                  type: string
                  description: Not case-sensitive.
                password:
                  type: string
                device:
                  type: string
                  description: A label for this session, such as "Living room iPad".
      responses:
        "200":
          description: Signed in. Sessions last 90 days after their last use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-out:
    post:
      tags: [Accounts]
      operationId: signOut
      summary: Sign out
      description: Ends the session whose token the request carries.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Signed out.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me:
    get:
      tags: [Accounts]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/me/password:
    put:
      tags: [Accounts]
      operationId: changePassword
      summary: Change your password
      description: Signs out every other session of this user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users:
    get:
      tags: [Accounts]
      operationId: listUsers
      summary: List users
      description: Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Accounts]
      operationId: createUser
      summary: Create a user
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password, role]
              properties:
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  description: Libraries a reader may open. Ignored for admins.
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A user with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Accounts]
      operationId: updateUser
      summary: Change a user
      description: Admin only. Setting a password signs that user out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The changed user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Accounts]
      operationId: deleteUser
      summary: Delete a user
      description: Admin only. Also ends the user's sessions.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The user was deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List libraries
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every library on the server.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Libraries]
      operationId: addLibrary
      summary: Add a folder library
      description: Adds a folder on the server as a library and starts scanning it. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, path]
              properties:
                name:
                  type: string
                  minLength: 1
                path:
                  type: string
                  description: Absolute path of a folder on the server.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The library was added and its first scan started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Libraries]
      operationId: getLibrary
      summary: Get a library
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The library, including the state of its last scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [Libraries]
      operationId: scanLibrary
      summary: Rescan a library
      description: Starts a scan in the background. Poll the library to see when it finishes. Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: The scan started.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The library is already being scanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/publications:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Catalog]
      operationId: listLibraryPublications
      summary: List a library's publications
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Catalog]
      operationId: getPublication
      summary: Get a publication
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/file:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationFile
      summary: Download the original file
      description: |
        Serves the file as it is on disk. Supports `Range` for partial reads and
        `If-Modified-Since` for revalidation.
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-65535
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The whole file.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "416":
          description: The range is outside the file.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/cover:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationCover
      summary: Get the cover thumbnail
      description: A JPEG that fits within 400 by 600 pixels, made when the file is scanned.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The cover.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: listPublicationPages
      summary: List a comic's pages
      description: The page index in reading order. Empty for formats without pages, such as EPUB.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages/{pageIndex}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
      - name: pageIndex
        in: path
        required: true
        description: Zero-based position in reading order.
        schema:
          type: integer
          minimum: 0
    get:
      tags: [Reading]
      operationId: getPublicationPage
      summary: Get a comic page
      description: The page's original image bytes, read straight from the archive.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The page image.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The token from sign-in or setup.
  headers:
    ETag:
      description: Changes whenever the file's content changes. Send it back in `If-None-Match`.
      schema:
        type: string
  parameters:
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page. Values outside the range are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: The request has no valid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in user may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LastAdmin:
      description: The change would leave the server without an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentChanged:
      description: |
        The file changed on disk since it was scanned. A rescan has started;
        retry after it finishes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed; details are in its log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserName:
      type: string
      minLength: 1
      maxLength: 64
    Password:
      type: string
      minLength: 8
      description: At least 8 characters and at most 1024 bytes.
    Role:
      type: string
      enum: [admin, reader]
    User:
      type: object
      required: [id, name, role, libraryIds, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        libraryIds:
          type: array
          description: Libraries a reader may open. Empty for admins, who see every library.
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        user:
          $ref: "#/components/schemas/User"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - unavailable
            - scan_in_progress
            - content_changed
            - already_set_up
            - name_taken
            - last_admin
            - internal
        message:
          type: string
          description: Explains the problem to a developer.
    Library:
      type: object
      required: [id, name, kind, path, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [folder, source]
        path:
          type: [string, "null"]
          description: The folder on the server, for folder libraries.
        scan:
          $ref: "#/components/schemas/ScanState"
        createdAt:
          type: string
          format: date-time
    ScanState:
      type: object
      required: [status, error, finishedAt]
      properties:
        status:
          type: string
          enum: [idle, scanning, failed]
        error:
          type: [string, "null"]
          description: Why the last scan failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the last scan finished, whether or not it succeeded.
    PublicationSummary:
      type: object
      required: [id, series, title, numberLabel, format, pageCount, available, hasCover]
      properties:
        id:
          type: integer
          format: int64
        series:
          type: object
          required: [id, title]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
        title:
          type: string
        numberLabel:
          type: [string, "null"]
          description: The volume or chapter number as written, such as "Vol. 3".
        format:
          type: string
          enum: [epub, pdf, cbz]
        pageCount:
          type: [integer, "null"]
          description: Number of pages for comic formats.
        available:
          type: boolean
          description: False when the file is missing from disk. Missing files are kept so progress survives.
        hasCover:
          type: boolean
          description: Whether `/cover` has an image for this publication.
    PageInfo:
      type: object
      required: [index, mediaType, size]
      properties:
        index:
          type: integer
          minimum: 0
        mediaType:
          type: string
          example: image/jpeg
        size:
          type: integer
          format: int64
          description: The image's size in bytes.
