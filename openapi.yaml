openapi: 3.1.0
info:
  title: Chek server API
  version: 0.1.0
  description: |
    The contract between the Chek server and its clients. This file is written
    by hand and is the source of truth: change it in the same pull request as
    the server code, and clients generate their code from a tagged release.

    Every operation except `/health`, `/api/v1/setup` and sign-in needs a
    session token from sign-in, sent as `Authorization: Bearer <token>`.
    HTTP Basic credentials (name and password) work too, for OPDS reader apps
    that can't hold a token.
    Admins see every library; readers see only the libraries they were granted,
    and other libraries and their publications answer as not found.
servers:
  - url: http://localhost:8080
security:
  - session: []
  - basic: []
tags:
  - name: Health
    description: Whether the server is up.
  - name: Accounts
    description: Setup, sign-in and user management.
  - name: Libraries
    description: Folders and sources the server reads publications from.
  - name: Catalog
    description: Series and publications found in libraries.
  - name: Reading
    description: Files, pages and covers.
  - name: Progress
    description: Reading positions synced between devices.
  - name: Annotations
    description: Bookmarks and highlights synced between devices.
  - name: OPDS
    description: |
      An [OPDS 2](https://drafts.opds.io/opds-2.0) catalog for other reader
      apps. Unauthenticated requests get a Basic challenge and an
      Authentication for OPDS document.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the server is running
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/setup:
    post:
      tags: [Accounts]
      operationId: setUp
      summary: Create the first admin
      description: |
        Works only while the server has no accounts. The setup token is printed
        in the server's log at startup, so only someone who can read the log
        can claim the server, unless the deployment set its own in
        `CHEK_SETUP_TOKEN`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setupToken, name, password]
              properties:
                setupToken:
                  type: string
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "201":
          description: The admin was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The server already has an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-in:
    post:
      tags: [Accounts]
      operationId: signIn
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password]
              properties:
                name:
                  type: string
                  description: Not case-sensitive.
                password:
                  type: string
                device:
                  type: string
                  description: A label for this session, such as "Living room iPad".
      responses:
        "200":
          description: Signed in. Sessions last 90 days after their last use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-out:
    post:
      tags: [Accounts]
      operationId: signOut
      summary: Sign out
      description: Ends the session whose token the request carries.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Signed out.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/providers:
    get:
      tags: [Accounts]
      operationId: listSignInProviders
      summary: List sign-in providers
      description: |
        The OpenID Connect providers people can sign in with, such as
        Authentik, Authelia or Google, for drawing sign-in buttons. Empty when
        the server has none.
      security: []
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignInProvider"
  /api/v1/auth/providers/{providerId}/authorize:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      tags: [Accounts]
      operationId: authorizeSignIn
      summary: Start signing in with a provider
      description: |
        Returns the provider's sign-in page. Open it in a browser, such as
        `ASWebAuthenticationSession`. After signing in, the browser is sent to
        `redirectUri` with a one-time `code`, or with `error` and
        `error_description` when sign-in failed. Trade the code for a session
        with [exchangeSignInCode](#operation/exchangeSignInCode) within 5
        minutes. The person has 10 minutes to sign in at the provider.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: The page to open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          $ref: "#/components/responses/TooManySignIns"
  /api/v1/auth/callback:
    get:
      tags: [Accounts]
      operationId: signInCallback
      summary: Return from a provider
      description: |
        Where providers send people back to after signing in; register
        `<CHEK_PUBLIC_URL>/api/v1/auth/callback` as the redirect URI with each
        provider. Apps don't call it. It sends the browser on to the app's
        `redirectUri`.
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Sent on to the app, with `code`, or `error` and `error_description`.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/exchange:
    post:
      tags: [Accounts]
      operationId: exchangeSignInCode
      summary: Finish signing in with a provider
      description: |
        Trades the one-time code from the redirect, and the PKCE verifier the
        sign-in started with, for a session. Each code works once, even when
        the verifier is wrong. A code from linking links the provider account
        to the user who started it and returns that user without a token.

        Someone signing in for the first time gets an account only when the
        provider allows it (`CHEK_OIDC_<ID>_CREATE_USERS`); otherwise they
        link the provider from an account they already have.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier]
              properties:
                code:
                  type: string
                codeVerifier:
                  type: string
                device:
                  type: string
                  description: A label for this session, such as "Living room iPad".
      responses:
        "200":
          description: Signed in, or linked.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  token:
                    type: string
                    description: "Send as `Authorization: Bearer <token>`. Absent after linking."
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: No account is linked to this provider account, and the provider doesn't create accounts (`not_linked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The provider account is linked to someone else, or this user already has another account at the provider (`identity_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me:
    get:
      tags: [Accounts]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/me/password:
    put:
      tags: [Accounts]
      operationId: changePassword
      summary: Change your password
      description: Signs out every other session of this user. Accounts made by a sign-in provider set their first password here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  description: Required unless the account has no password yet, as accounts made by a sign-in provider don't.
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/sessions:
    get:
      tags: [Accounts]
      operationId: listSessions
      summary: List your signed-in devices
      description: Sessions that haven't expired, most recently used first.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Your sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Accounts]
      operationId: deleteSession
      summary: Sign a device out
      description: Ends one of your sessions, such as a lost device's. Ending the current one signs you out.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The session was ended.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users:
    get:
      tags: [Accounts]
      operationId: listUsers
      summary: List users
      description: Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Accounts]
      operationId: createUser
      summary: Create a user
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password, role]
              properties:
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  description: Libraries a reader may open. Ignored for admins.
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A user with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Accounts]
      operationId: updateUser
      summary: Change a user
      description: Admin only. Setting a password signs that user out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The changed user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Accounts]
      operationId: deleteUser
      summary: Delete a user
      description: Admin only. Also ends the user's sessions.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The user was deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List libraries
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every library on the server.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Libraries]
      operationId: addLibrary
      summary: Add a library
      description: |
        Admin only. Adds a folder on the server as a library and starts
        scanning it, or adds a Komga server as a source library and starts
        syncing it. Send either `path` or `komga`.

        A Komga library reads Komga's series and books with one Komga
        account, and serves their pages and files through Komga. The account
        needs the page streaming and file download roles. The address and
        credentials are checked before the library is added, and stored on
        the server; they are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                path:
                  type: string
                  description: Absolute path of a folder on the server.
                komga:
                  $ref: "#/components/schemas/NewKomgaSource"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The library was added and its first scan started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400":
          description: |
            The request was malformed, or Komga couldn't be reached with the
            settings given (`source_check_failed`, with the reason).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Libraries]
      operationId: getLibrary
      summary: Get a library
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The library, including the state of its last scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - name: path
        in: path
        required: true
        description: >-
          Where to store the file, relative to the library's folder, with `/`
          between folders, such as `Saga/Saga 01.cbz`. Missing folders are
          created. Every part must be a plain name (no `.`, `..` or names
          starting with `.`), and the file must end in `.epub`, `.pdf`,
          `.cbz`, `.cbr`, `.cb7` or `.cbt`. A comic may be any comic archive
          whatever its comic extension says.
        schema:
          type: string
          maxLength: 1024
    put:
      tags: [Libraries]
      operationId: uploadFile
      summary: Upload a file into a folder library
      description: >-
        Admin only. The request body is the file's bytes, up to
        `CHEK_MAX_UPLOAD_BYTES` (2 GiB by default). The file is checked against
        its extension, moved into place and recorded like any file the scan
        finds. If a scan of the library is running, recording waits for it,
        and after 20 seconds the response is 202 while recording carries on.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The file was stored and recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationSummary"
        "202":
          description: The file was stored and will be recorded once the running scan finishes.
          content:
            application/json:
              schema:
                type: object
                required: [path, status]
                properties:
                  path:
                    type: string
                  status:
                    type: string
                    enum: [queued]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            A file already exists at that path (`file_exists`), or the server
            can't write to the library's folder (`library_read_only`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than `CHEK_MAX_UPLOAD_BYTES`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The file was stored but can't be read, such as a damaged archive.
            It stays in the folder like any other unreadable file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [Libraries]
      operationId: scanLibrary
      summary: Rescan a library
      description: Starts a scan in the background. Poll the library to see when it finishes. Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: The scan started.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The library is already being scanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/publications:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Catalog]
      operationId: listLibraryPublications
      summary: List a library's publications
      description: >-
        Publications come grouped by series, with series in title order. Within
        a series, numbered publications come first in number order, then the
        rest by title. Numbers inside titles compare by value, so "Episode 2"
        comes before "Episode 10".
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/series:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Catalog]
      operationId: listLibrarySeries
      summary: List a library's series
      description: Series in title order, with numbers inside titles compared by value.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of series.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Series"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/identities:
    get:
      tags: [Accounts]
      operationId: listIdentities
      summary: List your linked sign-in providers
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Your linked providers, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/identities/{providerId}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    delete:
      tags: [Accounts]
      operationId: unlinkIdentity
      summary: Unlink a sign-in provider
      description: Refused when it's the only way you can sign in; set a password first.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The provider was unlinked.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It's the only way you can sign in (`last_sign_in`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/identities/{providerId}/authorize:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      tags: [Accounts]
      operationId: authorizeLink
      summary: Start linking a sign-in provider
      description: |
        Works like [authorizeSignIn](#operation/authorizeSignIn), for the
        signed-in user. The link is made when the code is traded with
        [exchangeSignInCode](#operation/exchangeSignInCode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: The page to open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          $ref: "#/components/responses/TooManySignIns"
  /api/v1/me/continue-reading:
    get:
      tags: [Progress]
      operationId: listContinueReading
      summary: List publications to continue
      description: >-
        Publications the user has a position in and hasn't finished, most
        recently read first. A position whose `totalProgression` is 1 counts
        as finished; one without it counts as started. Unavailable
        publications and libraries the user can no longer read are left out.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications with the user's position in each.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [publication, progress]
                      properties:
                        publication:
                          $ref: "#/components/schemas/PublicationSummary"
                        progress:
                          $ref: "#/components/schemas/Progress"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/recently-added:
    get:
      tags: [Catalog]
      operationId: listRecentlyAdded
      summary: List recently added publications
      description: >-
        Available publications, newest first, from every library the user can
        read. A file changed in place keeps its original place.
      parameters:
        - name: libraryId
          in: query
          description: List only this library.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search:
    get:
      tags: [Catalog]
      operationId: searchPublications
      summary: Search publications
      description: >-
        Matches every word of the query against titles, series names,
        contributors and publishers, ignoring case and accents. Each word also
        matches the start of a longer word, so results can follow typing.
        Title matches rank first, and equal matches stay in reading order.
        Only libraries the user can read are searched.
      parameters:
        - name: q
          in: query
          required: true
          description: What to search for, up to 200 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: libraryId
          in: query
          description: Search only this library.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/series/{seriesId}:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      tags: [Catalog]
      operationId: getSeries
      summary: Get a series
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/series/{seriesId}/publications:
    parameters:
      - $ref: "#/components/parameters/SeriesId"
    get:
      tags: [Catalog]
      operationId: listSeriesPublications
      summary: List a series' publications
      description: >-
        Numbered publications first in number order, then the rest by title.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Catalog]
      operationId: getPublication
      summary: Get a publication
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The publication with its metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [Catalog]
      operationId: editPublication
      summary: Edit a publication's metadata
      description: >-
        Admin only. Fields left out stay as they are, `null` clears one, and a
        blank string counts as `null`. Edited fields are written over what the
        file says after every rescan, until they're cleared with
        `DELETE /api/v1/publications/{publicationId}/edits`. Changing the
        number changes where the publication sorts in its series.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Can't be cleared.
                number:
                  type: [string, "null"]
                  maxLength: 1000
                  description: The issue or volume label, such as `Vol. 2`; it sorts by the number it contains.
                description:
                  type: [string, "null"]
                  maxLength: 20000
                publisher:
                  type: [string, "null"]
                  maxLength: 1000
                language:
                  type: [string, "null"]
                  maxLength: 35
                  description: A BCP 47 language tag.
                published:
                  type: [string, "null"]
                  pattern: "^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$"
                readingDirection:
                  type: [string, "null"]
                  enum: [ltr, rtl, null]
                contributors:
                  type: [array, "null"]
                  maxItems: 50
                  description: Replaces the whole list; `null` or `[]` lists nobody.
                  items:
                    $ref: "#/components/schemas/Contributor"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The publication as edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/edits:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    delete:
      tags: [Catalog]
      operationId: clearPublicationEdits
      summary: Undo a publication's edits
      description: >-
        Admin only. Drops every edit and reads the file's own metadata again.
        If a scan of the library is running, reading waits for it, and after
        20 seconds the response is 202 while reading carries on. A
        publication from a source library answers 202 at once, and a sync of
        its library reads it again.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The publication with the file's own metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDetail"
        "202":
          description: The edits are gone and the file will be read once the running scan finishes, or by the next sync of a source library.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [queued]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/file:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationFile
      summary: Download the original file
      description: |
        Serves the file as it is on disk. Supports `Range` for partial reads and
        `If-Modified-Since` for revalidation. A publication from a source
        library is streamed from its source, which may send the whole file
        instead of a range, as Komga does.
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-65535
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The whole file.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "416":
          description: The range is outside the file.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/cover:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationCover
      summary: Get the cover thumbnail
      description: A JPEG that fits within 400 by 600 pixels, made when the file is scanned.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The cover.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: listPublicationPages
      summary: List a comic's pages
      description: The page index in reading order. Empty for formats without pages, such as EPUB.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages/{pageIndex}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
      - name: pageIndex
        in: path
        required: true
        description: Zero-based position in reading order.
        schema:
          type: integer
          minimum: 0
    get:
      tags: [Reading]
      operationId: getPublicationPage
      summary: Get a comic page
      description: The page's original image bytes, read straight from the archive.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The page image.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "502":
          $ref: "#/components/responses/SourceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/progress:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Progress]
      operationId: getProgress
      summary: Get your reading position
      description: Revision 0 with a null locator means nothing has been saved yet.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The saved position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Progress]
      operationId: saveProgress
      summary: Save your reading position
      description: |
        Saves only if the stored revision is still `expectedRevision`. If
        another device saved since, the response is a conflict carrying that
        position; the client asks the reader which one to keep and saves
        again with the revision from the conflict. The server never resolves a
        conflict by keeping the position furthest along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, locator]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The revision last read, or 0 when nothing was saved.
                locator:
                  $ref: "#/components/schemas/Locator"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The position was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another device saved first; `current` is its position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressConflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/annotations:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Annotations]
      operationId: listAnnotations
      summary: List your bookmarks and highlights
      description: >-
        Every annotation you made in the publication, in reading order by
        `totalProgression`. Ones without it come last, oldest first.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Your annotations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Annotations]
      operationId: addAnnotation
      summary: Add a bookmark or highlight
      description: >-
        A highlight's locator must carry the highlighted text in
        `text.highlight`. A publication holds up to 5,000 annotations per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, locator]
              properties:
                kind:
                  $ref: "#/components/schemas/AnnotationKind"
                locator:
                  $ref: "#/components/schemas/Locator"
                color:
                  $ref: "#/components/schemas/AnnotationColor"
                note:
                  $ref: "#/components/schemas/AnnotationNote"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: The new annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/annotations/{annotationId}:
    parameters:
      - name: annotationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Annotations]
      operationId: updateAnnotation
      summary: Change a bookmark or highlight
      description: >-
        Fields left out stay as they are, and `null` clears one. The last save
        wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                color:
                  oneOf:
                    - $ref: "#/components/schemas/AnnotationColor"
                    - type: "null"
                note:
                  oneOf:
                    - $ref: "#/components/schemas/AnnotationNote"
                    - type: "null"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The changed annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Annotations]
      operationId: deleteAnnotation
      summary: Delete a bookmark or highlight
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The annotation was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
