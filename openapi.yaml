openapi: 3.1.0
info:
  title: Chek server API
  version: 0.1.0
  description: |
    The contract between the Chek server and its clients. This file is written
    by hand and is the source of truth: change it in the same pull request as
    the server code, and clients generate their code from a tagged release.

    Every operation except `/health`, `/api/v1/setup` and sign-in needs a
    session token from sign-in, sent as `Authorization: Bearer <token>`.
    HTTP Basic credentials (name and password) work too, for OPDS reader apps
    that can't hold a token.
    Admins see every library; readers see only the libraries they were granted,
    and other libraries and their publications answer as not found.
servers:
  - url: http://localhost:8080
security:
  - session: []
  - basic: []
tags:
  - name: Health
    description: Whether the server is up.
  - name: Accounts
    description: Setup, sign-in and user management.
  - name: Libraries
    description: Folders and sources the server reads publications from.
  - name: Catalog
    description: Series and publications found in libraries.
  - name: Reading
    description: Files, pages and covers.
  - name: Progress
    description: Reading positions synced between devices.
  - name: OPDS
    description: |
      An [OPDS 2](https://drafts.opds.io/opds-2.0) catalog for other reader
      apps. Unauthenticated requests get a Basic challenge.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the server is running
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/setup:
    post:
      tags: [Accounts]
      operationId: setUp
      summary: Create the first admin
      description: |
        Works only while the server has no accounts. The setup token is printed
        in the server's log at startup, so only someone who can read the log
        can claim the server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setupToken, name, password]
              properties:
                setupToken:
                  type: string
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "201":
          description: The admin was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The server already has an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-in:
    post:
      tags: [Accounts]
      operationId: signIn
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password]
              properties:
                name:
                  type: string
                  description: Not case-sensitive.
                password:
                  type: string
                device:
                  type: string
                  description: A label for this session, such as "Living room iPad".
      responses:
        "200":
          description: Signed in. Sessions last 90 days after their last use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/sign-out:
    post:
      tags: [Accounts]
      operationId: signOut
      summary: Sign out
      description: Ends the session whose token the request carries.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: Signed out.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me:
    get:
      tags: [Accounts]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/me/password:
    put:
      tags: [Accounts]
      operationId: changePassword
      summary: Change your password
      description: Signs out every other session of this user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/sessions:
    get:
      tags: [Accounts]
      operationId: listSessions
      summary: List your signed-in devices
      description: Sessions that haven't expired, most recently used first.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Your sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/me/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Accounts]
      operationId: deleteSession
      summary: Sign a device out
      description: Ends one of your sessions, such as a lost device's. Ending the current one signs you out.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The session was ended.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users:
    get:
      tags: [Accounts]
      operationId: listUsers
      summary: List users
      description: Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Accounts]
      operationId: createUser
      summary: Create a user
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password, role]
              properties:
                name:
                  $ref: "#/components/schemas/UserName"
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  description: Libraries a reader may open. Ignored for admins.
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A user with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Accounts]
      operationId: updateUser
      summary: Change a user
      description: Admin only. Setting a password signs that user out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password:
                  $ref: "#/components/schemas/Password"
                role:
                  $ref: "#/components/schemas/Role"
                libraryIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The changed user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Accounts]
      operationId: deleteUser
      summary: Delete a user
      description: Admin only. Also ends the user's sessions.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: The user was deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List libraries
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every library on the server.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Libraries]
      operationId: addLibrary
      summary: Add a folder library
      description: Adds a folder on the server as a library and starts scanning it. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, path]
              properties:
                name:
                  type: string
                  minLength: 1
                path:
                  type: string
                  description: Absolute path of a folder on the server.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The library was added and its first scan started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Libraries]
      operationId: getLibrary
      summary: Get a library
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The library, including the state of its last scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      tags: [Libraries]
      operationId: scanLibrary
      summary: Rescan a library
      description: Starts a scan in the background. Poll the library to see when it finishes. Admin only.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: The scan started.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The library is already being scanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/libraries/{libraryId}/publications:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      tags: [Catalog]
      operationId: listLibraryPublications
      summary: List a library's publications
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: One page of publications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationSummary"
                  nextCursor:
                    type: string
                    description: Pass as `cursor` to get the next page. Absent on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Catalog]
      operationId: getPublication
      summary: Get a publication
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The publication with its metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/file:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationFile
      summary: Download the original file
      description: |
        Serves the file as it is on disk. Supports `Range` for partial reads and
        `If-Modified-Since` for revalidation.
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-65535
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The whole file.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "416":
          description: The range is outside the file.
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/cover:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: getPublicationCover
      summary: Get the cover thumbnail
      description: A JPEG that fits within 400 by 600 pixels, made when the file is scanned.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The cover.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Reading]
      operationId: listPublicationPages
      summary: List a comic's pages
      description: The page index in reading order. Empty for formats without pages, such as EPUB.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Every page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/pages/{pageIndex}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
      - name: pageIndex
        in: path
        required: true
        description: Zero-based position in reading order.
        schema:
          type: integer
          minimum: 0
    get:
      tags: [Reading]
      operationId: getPublicationPage
      summary: Get a comic page
      description: The page's original image bytes, read straight from the archive.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The page image.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/publications/{publicationId}/progress:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [Progress]
      operationId: getProgress
      summary: Get your reading position
      description: Revision 0 with a null locator means nothing has been saved yet.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The saved position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Progress]
      operationId: saveProgress
      summary: Save your reading position
      description: |
        Saves only if the stored revision is still `expectedRevision`. If
        another device saved since, the response is a conflict carrying that
        position; the client asks the reader which one to keep and saves
        again with the revision from the conflict. The server never resolves a
        conflict by keeping the position furthest along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, locator]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The revision last read, or 0 when nothing was saved.
                locator:
                  $ref: "#/components/schemas/Locator"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The position was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another device saved first; `current` is its position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressConflict"
        "500":
          $ref: "#/components/responses/Internal"
  /opds/v2/catalog:
    get:
      tags: [OPDS]
      operationId: getOpdsCatalog
      summary: OPDS start feed
      description: Navigation to each library the user may open.
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: An OPDS 2 navigation feed.
          content:
            application/opds+json:
              schema:
                $ref: "#/components/schemas/OpdsDocument"
        "500":
          $ref: "#/components/responses/Internal"
  /opds/v2/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - $ref: "#/components/parameters/Cursor"
    get:
      tags: [OPDS]
      operationId: getOpdsLibrary
      summary: OPDS feed of a library
      description: Publications 50 at a time; a `next` link points to the following page.
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: An OPDS 2 publications feed.
          content:
            application/opds+json:
              schema:
                $ref: "#/components/schemas/OpdsDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /opds/v2/publications/{publicationId}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [OPDS]
      operationId: getOpdsPublication
      summary: OPDS publication
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: An OPDS 2 publication.
          content:
            application/opds-publication+json:
              schema:
                $ref: "#/components/schemas/OpdsDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /opds/v2/publications/{publicationId}/file:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [OPDS]
      operationId: getOpdsPublicationFile
      summary: Download a publication from OPDS
      description: The same as `/api/v1/publications/{publicationId}/file`, with a Basic challenge on 401.
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: The original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range.
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentChanged"
        "500":
          $ref: "#/components/responses/Internal"
  /opds/v2/publications/{publicationId}/cover:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      tags: [OPDS]
      operationId: getOpdsPublicationCover
      summary: Get a cover from OPDS
      description: The same as `/api/v1/publications/{publicationId}/cover`, with a Basic challenge on 401.
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: A JPEG thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The token from sign-in or setup.
    basic:
      type: http
      scheme: basic
      description: A user's name and password, for apps that can't sign in first.
  headers:
    ETag:
      description: Changes whenever the file's content changes. Send it back in `If-None-Match`.
      schema:
        type: string
  parameters:
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page. Values outside the range are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: The request has no valid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OpdsUnauthorized:
      description: No valid credentials; the challenge asks for a name and password.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="Chek", charset="UTF-8"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in user may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: |
        Too many wrong passwords from this address in the last 15 minutes.
        Requests with a session token, or with Basic credentials already
        accepted, are not affected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LastAdmin:
      description: The change would leave the server without an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentChanged:
      description: |
        The file changed on disk since it was scanned. A rescan has started;
        retry after it finishes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed; details are in its log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserName:
      type: string
      minLength: 1
      maxLength: 64
    Password:
      type: string
      minLength: 8
      description: At least 8 characters and at most 1024 bytes.
    Role:
      type: string
      enum: [admin, reader]
    User:
      type: object
      required: [id, name, role, libraryIds, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        libraryIds:
          type: array
          description: Libraries a reader may open. Empty for admins, who see every library.
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        user:
          $ref: "#/components/schemas/User"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - unavailable
            - scan_in_progress
            - content_changed
            - already_set_up
            - name_taken
            - last_admin
            - progress_conflict
            - too_many_attempts
            - internal
        message:
          type: string
          description: Explains the problem to a developer.
    Library:
      type: object
      required: [id, name, kind, path, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [folder, source]
        path:
          type: [string, "null"]
          description: The folder on the server, for folder libraries.
        scan:
          $ref: "#/components/schemas/ScanState"
        createdAt:
          type: string
          format: date-time
    ScanState:
      type: object
      required: [status, error, finishedAt]
      properties:
        status:
          type: string
          enum: [idle, scanning, failed]
        error:
          type: [string, "null"]
          description: Why the last scan failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the last scan finished, whether or not it succeeded.
    PublicationSummary:
      type: object
      required: [id, series, title, numberLabel, format, pageCount, available, hasCover]
      properties:
        id:
          type: integer
          format: int64
        series:
          type: object
          required: [id, title]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
        title:
          type: string
          description: From the file's metadata, or its file name when it has none.
        numberLabel:
          type: [string, "null"]
          description: |
            The number in its series as the file's metadata writes it, such as
            "3", "1.5" or "Vol. 3".
        format:
          type: string
          enum: [epub, pdf, cbz]
        pageCount:
          type: [integer, "null"]
          description: Number of pages for comic formats.
        available:
          type: boolean
          description: False when the file is missing from disk. Missing files are kept so progress survives.
        hasCover:
          type: boolean
          description: Whether `/cover` has an image for this publication.
    PublicationDetail:
      description: |
        A publication with metadata read from the file: the EPUB package
        document, or `ComicInfo.xml` in a CBZ. PDFs carry none yet.
      allOf:
        - $ref: "#/components/schemas/PublicationSummary"
        - type: object
          required: [contributors, description, publisher, language, published, readingDirection]
          properties:
            contributors:
              type: array
              description: People credited, in the order the file lists them.
              items:
                $ref: "#/components/schemas/Contributor"
            description:
              type: [string, "null"]
              description: May contain HTML, as EPUB descriptions often do.
            publisher:
              type: [string, "null"]
            language:
              type: [string, "null"]
              description: A BCP 47 language tag.
              example: en
            published:
              type: [string, "null"]
              description: "`YYYY`, `YYYY-MM` or `YYYY-MM-DD`."
              example: "2014-06"
            readingDirection:
              type: [string, "null"]
              enum: [ltr, rtl, null]
              description: Set when the file says; right to left for manga marked so.
    Contributor:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - author
            - illustrator
            - penciler
            - inker
            - colorist
            - letterer
            - coverArtist
            - editor
            - translator
            - contributor
    PageInfo:
      type: object
      required: [index, mediaType, size]
      properties:
        index:
          type: integer
          minimum: 0
        mediaType:
          type: string
          example: image/jpeg
        size:
          type: integer
          format: int64
          description: The image's size in bytes.
    Progress:
      type: object
      required: [revision, locator, device, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Counts saves; 0 when nothing has been saved.
        locator:
          oneOf:
            - $ref: "#/components/schemas/Locator"
            - type: "null"
        device:
          type: [string, "null"]
          description: The device name of the session that saved it.
        updatedAt:
          type: [string, "null"]
          format: date-time
    ProgressConflict:
      type: object
      required: [code, message, current]
      properties:
        code:
          type: string
          const: progress_conflict
        message:
          type: string
        current:
          $ref: "#/components/schemas/Progress"
    Locator:
      type: object
      description: |
        A [Readium Locator](https://readium.org/architecture/models/locators/).
        The server checks the fields below and stores the rest as sent, up to
        16 KiB in all.
      required: [href, type]
      properties:
        href:
          type: string
          minLength: 1
        type:
          type: string
          description: The resource's media type.
          example: application/xhtml+xml
        title:
          type: string
        locations:
          type: object
          properties:
            fragments:
              type: array
              items:
                type: string
            progression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the resource.
            totalProgression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the publication.
            position:
              type: integer
              minimum: 1
        text:
          type: object
          properties:
            before:
              type: string
            highlight:
              type: string
            after:
              type: string
    OpdsDocument:
      type: object
      description: |
        An OPDS 2 feed or publication, defined by the
        [OPDS 2 schemas](https://drafts.opds.io/opds-2.0) rather than here.
        Publication metadata follows the Readium Web Publication model.
      properties:
        metadata:
          type: object
        links:
          type: array
          items:
            type: object
    SessionInfo:
      type: object
      required: [id, device, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        device:
          type: [string, "null"]
          description: The label given at sign-in.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Updated at most once an hour.
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session making the request.
