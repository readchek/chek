      tags: [OPDS]
      operationId: getOpdsPublicationFile
      summary: Download a publication from OPDS
      description: The same as `/api/v1/publications/{publicationId}/file`, with an OPDS sign-in challenge on 401.
      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
