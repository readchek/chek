      responses:
        "401":
          $ref: "#/components/responses/OpdsUnauthorized"
        "200":
          description: A JPEG thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The token from sign-in or setup.
    basic:
      type: http
      scheme: basic
      description: A user's name and password, for apps that can't sign in first.
  headers:
    ETag:
      description: Changes whenever the file's content changes. Send it back in `If-None-Match`.
      schema:
        type: string
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExtensionId:
      name: extensionId
      in: path
      required: true
      description: The extension's reverse-DNS id.
      schema:
        type: string
    RemoteSeriesId:
      name: seriesId
      in: query
      required: true
      description: The source's own series id.
      schema:
        type: string
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
    OpdsQuery:
      name: query
      in: query
      required: true
      description: What to search for, up to 200 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Items per page. Values outside the range are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: The request has no valid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OpdsUnauthorized:
      description: |
        No valid credentials. The Basic challenge and the Authentication for
        OPDS document both ask for a name and password.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="Chek", charset="UTF-8"
        Link:
          schema:
            type: string
          example: <https://chek.example/opds/v2/auth>; rel="http://opds-spec.org/auth/document"; type="application/opds-authentication+json"
      content:
        application/opds-authentication+json:
          schema:
            $ref: "#/components/schemas/OpdsAuthentication"
    Forbidden:
      description: |
        The signed-in user may not do this. `demo_account` when the user is a
        shared demo account, named in `CHEK_DEMO_USERS`, which can't change
        its password, sessions, sign-in providers, extensions or annotations.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: |
        Too many wrong passwords from this address in the last 15 minutes.
        Requests with a session token, or with Basic credentials already
        accepted, are not affected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LastAdmin:
      description: The change would leave the server without an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: The sign-in provider couldn't be reached (`provider_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManySignIns:
      description: Too many sign-ins are in progress at once (`too_many_sign_ins`); try again in a few minutes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceUnavailable:
      description: |
        The publication is from a source library, and its source couldn't be
        read (`source_unavailable`) or its extension failed (`source_failed`);
        the message says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentChanged:
      description: |
        The file changed on disk since it was scanned. A rescan has started;
        retry after it finishes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceFailed:
      description: >-
        The extension reported an error, went over a limit, or the image
        couldn't be fetched.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RepositoryUnreadable:
      description: The repository's index couldn't be fetched or isn't valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed; details are in its log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserName:
      type: string
      minLength: 1
      maxLength: 64
    Password:
      type: string
      minLength: 8
      description: At least 8 characters and at most 1024 bytes.
    Role:
      type: string
      enum: [admin, reader]
    User:
      type: object
      required: [id, name, role, libraryIds, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        libraryIds:
          type: array
          description: Libraries a reader may open. Empty for admins, who see every library.
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        user:
          $ref: "#/components/schemas/User"
    SignInProvider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: For the sign-in button.
    AuthorizeRequest:
      type: object
      additionalProperties: false
      required: [redirectUri, codeChallenge]
      properties:
        redirectUri:
          type: string
          format: uri
          description: |
            Where to send the browser after sign-in. Must start with the
            server's public URL or a prefix in `CHEK_OIDC_REDIRECTS`
            (`chek://` by default).
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          description: The base64url SHA-256 of a random PKCE code verifier (RFC 7636 S256), without padding.
    AuthorizeResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The provider's sign-in page.
    Identity:
      type: object
      required: [provider, name, createdAt]
      properties:
        provider:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - unavailable
            - scan_in_progress
            - content_changed
            - already_set_up
            - name_taken
            - last_admin
            - progress_conflict
            - too_many_attempts
            - not_linked
            - identity_taken
            - last_sign_in
            - provider_unavailable
            - too_many_sign_ins
            - repository_exists
            - repository_not_allowed
            - repository_unreadable
            - extension_invalid
            - source_failed
            - source_unavailable
            - source_check_failed
            - internal
        message:
          type: string
          description: Explains the problem to a developer.
    ExtensionRepository:
      type: object
      required: [id, url, name, allowListed, usable, hasCredentials, extensionCount, fetchedAt, fetchError, createdAt]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        name:
          type: [string, "null"]
          description: What the repository's index calls it.
        allowListed:
          type: boolean
          description: On the admin's allow list rather than added by the user.
        usable:
          type: boolean
          description: >-
            Whether its extensions can be installed and run. A user's own
            repository isn't while the admin allows only the allow list.
        hasCredentials:
          type: boolean
          description: Whether credentials are stored for it. They're never returned.
        extensionCount:
          type: integer
        fetchedAt:
          type: [string, "null"]
          format: date-time
          description: When the index was last fetched successfully.
        fetchError:
          type: [string, "null"]
          description: Why the last fetch failed, if it did.
        createdAt:
          type: string
          format: date-time
    RepositoryCredentials:
      description: >-
        How to sign in to a private repository. They're sent only to the
        index's own origin, and a request carrying them isn't followed to
        another origin. For a private GitHub repository, use `bearer` with a
        fine-grained token that can read its contents.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, token]
          properties:
            type:
              const: bearer
            token:
              type: string
        - type: object
          additionalProperties: false
          required: [type, username, password]
          properties:
            type:
              const: basic
            username:
              type: string
            password:
              type: string
        - type: object
          additionalProperties: false
          required: [type, name, value]
          properties:
            type:
              const: header
            name:
              type: string
              example: X-Api-Key
            value:
              type: string
    AvailableExtension:
      type: object
      required: [repositoryId, id, name, version, sites, languages, capabilities, installedVersion]
      properties:
        installedVersion:
          type: [string, "null"]
          description: The version the user installed from this repository, if any.
        repositoryId:
          type: integer
          format: int64
        id:
          type: string
          description: The extension's reverse-DNS id, such as `org.example.comics`.
        name:
          type: string
        version:
          type: string
        sites:
          type: array
          description: Hosts the extension may reach, such as `api.example.org` or `*.example.org`.
          items:
            type: string
        languages:
          type: array
          description: BCP 47 tags of the languages the source serves; empty for any.
          items:
            type: string
        capabilities:
          type: array
          description: >-
            What the extension needs beyond plain requests. `browser` means it
            uses the server's browser solver, set with `CHEK_BROWSER_SOLVER_URL`,
            to get past challenges such as Cloudflare's.
          items:
            type: string
    RemoteImageUrl:
      type: string
      description: A path on this server, relative to its base URL, that serves the image.
      example: /api/v1/me/extensions/org.example.comics/image?ref=eyJ1cmwiOi
    RemoteSeriesItem:
      type: object
      required: [id, title, coverUrl]
      properties:
        id:
          type: string
          description: The source's own series id.
        title:
          type: string
        coverUrl:
          oneOf:
            - $ref: "#/components/schemas/RemoteImageUrl"
            - type: "null"
    RemoteSeries:
      type: object
      required: [id, title, summary, coverUrl, contributors, readingDirection, status, year, tags]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: [string, "null"]
        coverUrl:
          oneOf:
            - $ref: "#/components/schemas/RemoteImageUrl"
            - type: "null"
        contributors:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name:
                type: string
              role:
                type: string
        readingDirection:
          type: [string, "null"]
          enum: [ltr, rtl, ttb, null]
        status:
          type: [string, "null"]
          enum: [ongoing, completed, hiatus, cancelled, null]
          description: Whether the series is still going, as the source says.
        year:
          type: [integer, "null"]
          description: The year the series started, when the source knows.
        tags:
          type: array
          items:
            type: string
          description: Genres and themes as the source names them, most important first.
    RemoteChapter:
      type: object
      required: [id, title, number, version, published]
      properties:
        id:
          type: string
          description: The source's own chapter id.
        title:
          type: string
        number:
          type: [string, "null"]
          description: The chapter or volume number as the source writes it.
        version:
          type: [string, "null"]
          description: Changes when the chapter's pages change.
        published:
          type: [string, "null"]
          description: An RFC 3339 date or date-time.
    InstalledExtension:
      type: object
      required: [id, name, version, repositoryId, sites, languages, installedAt, usable, update]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        repositoryId:
          type: integer
          format: int64
        sites:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        installedAt:
          type: string
          format: date-time
        usable:
          type: boolean
          description: >-
            False while it came from the user's own repository and the admin
            allows only the allow list.
        update:
          type: [string, "null"]
          description: The version the repository lists, when it differs from the installed one.
    Settings:
      type: object
      additionalProperties: false
      required: [allowAnyRepository]
      properties:
        allowAnyRepository:
          type: boolean
          description: Whether users other than admins may add repositories that aren't on the allow list.
    Library:
      type: object
      required: [id, name, kind, path, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [folder, source]
        path:
          type: [string, "null"]
          description: The folder on the server, for folder libraries.
        source:
          $ref: "#/components/schemas/LibrarySource"
        scan:
          $ref: "#/components/schemas/ScanState"
        createdAt:
          type: string
          format: date-time
    LibrarySource:
      type: object
      description: Where a source library reads from. Present only on source libraries.
      required: [type]
      properties:
        type:
          type: string
          enum: [komga, extension]
        url:
          type: string
          description: The Komga server's address. Absent for an extension library.
        extensionId:
          type: string
          description: The extension an extension library runs on.
        libraryIds:
          type: array
          description: The Komga libraries read; absent when every library the account sees is read.
          items:
            type: string
        progressUserId:
          type: integer
          format: int64
          description: The Chek user whose reading progress is written back to the Komga account. Absent when none is.
    NewKomgaSource:
      type: object
      additionalProperties: false
      description: |
        A Komga server to read, with an API key, or a name and password, for
        one Komga account. Everyone granted the Chek library reads what that
        account can see.
      required: [url]
      properties:
        url:
          type: string
          description: Komga's address, including any path it is served under.
          example: http://komga:25600
        apiKey:
          type: string
          description: An API key made in Komga for the account.
        username:
          type: string
          description: The account's email address, with `password`.
        password:
          type: string
        libraryIds:
          type: array
          description: Komga library ids to read; leave out to read every library the account sees.
          items:
            type: string
        writeProgress:
          type: boolean
          default: true
          description: |
            Writes your reading progress in this library back to the Komga
            account, so Komga's own apps stay in step. Only the admin who
            adds the library is written back, since every reader shares the
            one Komga account.
    Series:
      type: object
      required: [id, libraryId, title, publicationCount]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        title:
          type: string
        publicationCount:
          type: integer
          format: int64
        coverPublicationId:
          type: [integer, "null"]
          format: int64
          description: >-
            The first publication in the series that has a cover; fetch its
            cover to show the series.
    ScanState:
      type: object
      required: [status, error, finishedAt]
      properties:
        status:
          type: string
          enum: [idle, scanning, failed]
        error:
          type: [string, "null"]
          description: Why the last scan failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the last scan finished, whether or not it succeeded.
    PublicationSummary:
      type: object
      required: [id, series, title, numberLabel, format, pageCount, available, hasCover]
      properties:
        id:
          type: integer
          format: int64
        series:
          type: object
          required: [id, title]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
        title:
          type: string
          description: From the file's metadata, or its file name when it has none.
        numberLabel:
          type: [string, "null"]
          description: |
            The number in its series as the file's metadata writes it, such as
            "3", "1.5" or "Vol. 3".
        format:
          type: string
          enum: [epub, pdf, cbz, cbt, cbr, cb7, mobi, azw3, fb2, txt, markdown, remote]
          description: |
            Comic archives get their format from their bytes, so a ZIP named
            `.cbr` is `cbz`. `remote` is a chapter from an extension: it has
            pages but no file.
        pageCount:
          type: [integer, "null"]
          description: Number of pages for comic formats.
        available:
          type: boolean
          description: False when the file is missing from disk. Missing files are kept so progress survives.
        hasCover:
          type: boolean
          description: Whether `/cover` has an image for this publication.
    PublicationDetail:
      description: |
        A publication with metadata read from the file (the EPUB package
        document, `ComicInfo.xml` in a CBZ, or a PDF's document information),
        with any fields an admin edited written over it.
      allOf:
        - $ref: "#/components/schemas/PublicationSummary"
        - type: object
          required: [editedFields, contributors, description, publisher, language, published, readingDirection]
          properties:
            editedFields:
              type: array
              description: Fields an admin changed by hand, which rescans keep.
              items:
                type: string
                enum: [title, number, description, publisher, language, published, readingDirection, contributors]
            contributors:
              type: array
              description: People credited, in the order the file lists them.
              items:
                $ref: "#/components/schemas/Contributor"
            description:
              type: [string, "null"]
              description: May contain HTML, as EPUB descriptions often do.
            publisher:
              type: [string, "null"]
            language:
              type: [string, "null"]
              description: A BCP 47 language tag.
              example: en
            published:
              type: [string, "null"]
              description: "`YYYY`, `YYYY-MM` or `YYYY-MM-DD`."
              example: "2014-06"
            readingDirection:
              type: [string, "null"]
              enum: [ltr, rtl, null]
              description: Set when the file says; right to left for manga marked so.
    Contributor:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - author
            - illustrator
            - penciler
            - inker
            - colorist
            - letterer
            - coverArtist
            - editor
            - translator
            - contributor
    PageInfo:
      type: object
      required: [index, mediaType, size]
      properties:
        index:
          type: integer
          minimum: 0
        mediaType:
          type: string
          example: image/jpeg
        size:
          type: [integer, "null"]
          format: int64
          description: >-
            The image's size in bytes. Null for an extension chapter's pages,
            whose size isn't known until they're fetched; their `mediaType` is
            guessed from the page's URL.
    Progress:
      type: object
      required: [revision, locator, device, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Counts saves; 0 when nothing has been saved.
        locator:
          oneOf:
            - $ref: "#/components/schemas/Locator"
            - type: "null"
        device:
          type: [string, "null"]
          description: The device name of the session that saved it.
        updatedAt:
          type: [string, "null"]
          format: date-time
    ProgressConflict:
      type: object
      required: [code, message, current]
      properties:
        code:
          type: string
          const: progress_conflict
        message:
          type: string
        current:
          $ref: "#/components/schemas/Progress"
    AnnotationKind:
      type: string
      enum: [bookmark, highlight]
    AnnotationColor:
      type: string
      minLength: 1
      maxLength: 32
      description: A color name or value the client chooses, such as `yellow`.
    AnnotationNote:
      type: string
      maxLength: 10000
    Annotation:
      type: object
      required: [id, publicationId, kind, locator, color, note, device, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        publicationId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/AnnotationKind"
        locator:
          $ref: "#/components/schemas/Locator"
        color:
          type: [string, "null"]
        note:
          type: [string, "null"]
        device:
          type: [string, "null"]
          description: The device name of the session that last saved it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Locator:
      type: object
      description: |
        A [Readium Locator](https://readium.org/architecture/models/locators/).
        The server checks the fields below and stores the rest as sent, up to
        16 KiB in all.
      required: [href, type]
      properties:
        href:
          type: string
          minLength: 1
        type:
          type: string
          description: The resource's media type.
          example: application/xhtml+xml
        title:
          type: string
        locations:
          type: object
          properties:
            fragments:
              type: array
              items:
                type: string
            progression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the resource.
            totalProgression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the publication.
            position:
              type: integer
              minimum: 1
        text:
          type: object
          properties:
            before:
              type: string
            highlight:
              type: string
            after:
              type: string
    OpdsAuthentication:
      type: object
      description: |
        An [Authentication for OPDS](https://drafts.opds.io/authentication-for-opds-1.0)
        document offering HTTP Basic sign-in.
      required: [id, title, authentication]
      properties:
        id:
          type: string
          format: uri
        title:
          type: string
        authentication:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                example: http://opds-spec.org/auth/basic
              labels:
                type: object
                properties:
                  login:
                    type: string
                  password:
                    type: string
    OpdsDocument:
      type: object
      description: |
        An OPDS 2 feed or publication, defined by the
        [OPDS 2 schemas](https://drafts.opds.io/opds-2.0) rather than here.
        Publication metadata follows the Readium Web Publication model.
      properties:
        metadata:
          type: object
        links:
          type: array
          items:
            type: object
    SessionInfo:
      type: object
      required: [id, device, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        device:
          type: [string, "null"]
          description: The label given at sign-in.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Updated at most once an hour.
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session making the request.
