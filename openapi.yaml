        "304":
          description: The client's copy is current.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: The token from sign-in or setup.
    basic:
      type: http
      scheme: basic
      description: A user's name and password, for apps that can't sign in first.
  headers:
    ETag:
      description: Changes whenever the file's content changes. Send it back in `If-None-Match`.
      schema:
        type: string
  parameters:
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
    OpdsQuery:
      name: query
      in: query
      required: true
      description: What to search for, up to 200 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Items per page. Values outside the range are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: The request has no valid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OpdsUnauthorized:
      description: |
        No valid credentials. The Basic challenge and the Authentication for
        OPDS document both ask for a name and password.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="Chek", charset="UTF-8"
        Link:
          schema:
            type: string
          example: <https://chek.example/opds/v2/auth>; rel="http://opds-spec.org/auth/document"; type="application/opds-authentication+json"
      content:
        application/opds-authentication+json:
          schema:
            $ref: "#/components/schemas/OpdsAuthentication"
    Forbidden:
      description: The signed-in user may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: |
        Too many wrong passwords from this address in the last 15 minutes.
        Requests with a session token, or with Basic credentials already
        accepted, are not affected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LastAdmin:
      description: The change would leave the server without an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentChanged:
      description: |
        The file changed on disk since it was scanned. A rescan has started;
        retry after it finishes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed; details are in its log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserName:
      type: string
      minLength: 1
      maxLength: 64
    Password:
      type: string
      minLength: 8
      description: At least 8 characters and at most 1024 bytes.
    Role:
      type: string
      enum: [admin, reader]
    User:
      type: object
      required: [id, name, role, libraryIds, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        libraryIds:
          type: array
          description: Libraries a reader may open. Empty for admins, who see every library.
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        user:
          $ref: "#/components/schemas/User"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - unavailable
            - scan_in_progress
            - content_changed
            - already_set_up
            - name_taken
            - last_admin
            - progress_conflict
            - too_many_attempts
            - internal
        message:
          type: string
          description: Explains the problem to a developer.
    Library:
      type: object
      required: [id, name, kind, path, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [folder, source]
        path:
          type: [string, "null"]
          description: The folder on the server, for folder libraries.
        scan:
          $ref: "#/components/schemas/ScanState"
        createdAt:
          type: string
          format: date-time
    Series:
      type: object
      required: [id, libraryId, title, publicationCount]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        title:
          type: string
        publicationCount:
          type: integer
          format: int64
        coverPublicationId:
          type: [integer, "null"]
          format: int64
          description: >-
            The first publication in the series that has a cover; fetch its
            cover to show the series.
    ScanState:
      type: object
      required: [status, error, finishedAt]
      properties:
        status:
          type: string
          enum: [idle, scanning, failed]
        error:
          type: [string, "null"]
          description: Why the last scan failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the last scan finished, whether or not it succeeded.
    PublicationSummary:
      type: object
      required: [id, series, title, numberLabel, format, pageCount, available, hasCover]
      properties:
        id:
          type: integer
          format: int64
        series:
          type: object
          required: [id, title]
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
        title:
          type: string
          description: From the file's metadata, or its file name when it has none.
        numberLabel:
          type: [string, "null"]
          description: |
            The number in its series as the file's metadata writes it, such as
            "3", "1.5" or "Vol. 3".
        format:
          type: string
          enum: [epub, pdf, cbz]
        pageCount:
          type: [integer, "null"]
          description: Number of pages for comic formats.
        available:
          type: boolean
          description: False when the file is missing from disk. Missing files are kept so progress survives.
        hasCover:
          type: boolean
          description: Whether `/cover` has an image for this publication.
    PublicationDetail:
      description: |
        A publication with metadata read from the file: the EPUB package
        document, or `ComicInfo.xml` in a CBZ. PDFs carry none yet.
      allOf:
        - $ref: "#/components/schemas/PublicationSummary"
        - type: object
          required: [contributors, description, publisher, language, published, readingDirection]
          properties:
            contributors:
              type: array
              description: People credited, in the order the file lists them.
              items:
                $ref: "#/components/schemas/Contributor"
            description:
              type: [string, "null"]
              description: May contain HTML, as EPUB descriptions often do.
            publisher:
              type: [string, "null"]
            language:
              type: [string, "null"]
              description: A BCP 47 language tag.
              example: en
            published:
              type: [string, "null"]
              description: "`YYYY`, `YYYY-MM` or `YYYY-MM-DD`."
              example: "2014-06"
            readingDirection:
              type: [string, "null"]
              enum: [ltr, rtl, null]
              description: Set when the file says; right to left for manga marked so.
    Contributor:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - author
            - illustrator
            - penciler
            - inker
            - colorist
            - letterer
            - coverArtist
            - editor
            - translator
            - contributor
    PageInfo:
      type: object
      required: [index, mediaType, size]
      properties:
        index:
          type: integer
          minimum: 0
        mediaType:
          type: string
          example: image/jpeg
        size:
          type: integer
          format: int64
          description: The image's size in bytes.
    Progress:
      type: object
      required: [revision, locator, device, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Counts saves; 0 when nothing has been saved.
        locator:
          oneOf:
            - $ref: "#/components/schemas/Locator"
            - type: "null"
        device:
          type: [string, "null"]
          description: The device name of the session that saved it.
        updatedAt:
          type: [string, "null"]
          format: date-time
    ProgressConflict:
      type: object
      required: [code, message, current]
      properties:
        code:
          type: string
          const: progress_conflict
        message:
          type: string
        current:
          $ref: "#/components/schemas/Progress"
    AnnotationKind:
      type: string
      enum: [bookmark, highlight]
    AnnotationColor:
      type: string
      minLength: 1
      maxLength: 32
      description: A color name or value the client chooses, such as `yellow`.
    AnnotationNote:
      type: string
      maxLength: 10000
    Annotation:
      type: object
      required: [id, publicationId, kind, locator, color, note, device, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        publicationId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/AnnotationKind"
        locator:
          $ref: "#/components/schemas/Locator"
        color:
          type: [string, "null"]
        note:
          type: [string, "null"]
        device:
          type: [string, "null"]
          description: The device name of the session that last saved it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Locator:
      type: object
      description: |
        A [Readium Locator](https://readium.org/architecture/models/locators/).
        The server checks the fields below and stores the rest as sent, up to
        16 KiB in all.
      required: [href, type]
      properties:
        href:
          type: string
          minLength: 1
        type:
          type: string
          description: The resource's media type.
          example: application/xhtml+xml
        title:
          type: string
        locations:
          type: object
          properties:
            fragments:
              type: array
              items:
                type: string
            progression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the resource.
            totalProgression:
              type: number
              minimum: 0
              maximum: 1
              description: Position within the publication.
            position:
              type: integer
              minimum: 1
        text:
          type: object
          properties:
            before:
              type: string
            highlight:
              type: string
            after:
              type: string
    OpdsAuthentication:
      type: object
      description: |
        An [Authentication for OPDS](https://drafts.opds.io/authentication-for-opds-1.0)
        document offering HTTP Basic sign-in.
      required: [id, title, authentication]
      properties:
        id:
          type: string
          format: uri
        title:
          type: string
        authentication:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                example: http://opds-spec.org/auth/basic
              labels:
                type: object
                properties:
                  login:
                    type: string
                  password:
                    type: string
    OpdsDocument:
      type: object
      description: |
        An OPDS 2 feed or publication, defined by the
        [OPDS 2 schemas](https://drafts.opds.io/opds-2.0) rather than here.
        Publication metadata follows the Readium Web Publication model.
      properties:
        metadata:
          type: object
        links:
          type: array
          items:
            type: object
    SessionInfo:
      type: object
      required: [id, device, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        device:
          type: [string, "null"]
          description: The label given at sign-in.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Updated at most once an hour.
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether this is the session making the request.
