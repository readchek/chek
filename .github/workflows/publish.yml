name: Publish image

# Pushes ghcr.io/readchek/chek for every push to main (`edge`) and for every
# release tag such as `0.1.0` (`0.1.0`, `0.1` and `latest`). The Dockerfile's
# `browser` target, with Chromium for browser-backed extensions, gets the same
# tags with `-browser` on the end, such as `edge-browser`, in the same package
# so it needs no visibility setting of its own. Pull requests are
# checked by the Docker jobs in ci.yml, which build the same image without
# pushing; both share the GitHub Actions build cache, so a push to main
# mostly reuses what its pull request already built.
#
# Each architecture builds natively on its own runner and pushes by digest,
# then one job joins the two digests into a multi-platform manifest under the
# tags. Building arm64 under emulation took over half an hour.
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # The Release workflow tags with the Actions token, whose pushes start no
  # workflow, so it dispatches this one on the tag instead.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Every push publishes, so runs queue rather than cancel.
  group: publish-${{ github.ref }}

env:
  IMAGE: ghcr.io/readchek/chek

jobs:
  build:
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [default, browser]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push the layers without a tag; the manifest job tags the pair.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE }}
          # The same scopes as ci.yml's Docker jobs, so a push to main reuses
          # what its pull request built.
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.arch }}-${{ matrix.target }},mode=max
      - name: Start the image
        run: |
          docker run -d --name chek -p 8080:8080 "$IMAGE@${{ steps.build.outputs.digest }}"
          for _ in $(seq 30); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs chek
          exit 1
      - name: Save the digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag the ${{ matrix.target }} manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [default, browser]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=${{ matrix.target == 'browser' && '-browser' || '' }},onlatest=true
          # main is `edge`; a release tag gets its version, its minor
          # series and `latest`.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the manifest
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
