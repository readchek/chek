name: Release

# Cuts a release: tags `main` with the version, pushes the tag, writes the
# release page on GitHub and starts the Publish image workflow on the tag,
# which pushes ghcr.io/readchek/chek under the version, its minor series
# and `latest`. Run it from the Actions tab. Tagging by hand
# (`git tag 0.1.0 && git push origin 0.1.0`) starts the publish on its own
# but writes no release page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to tag, such as 0.1.0"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Tag main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version such as 0.1.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Chek $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Write the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # The notes list the pull requests merged since the last release.
        # People running a server read this page to see what an update
        # changes, and the docs link to it.
        run: gh release create "$VERSION" --verify-tag --title "Chek $VERSION" --generate-notes
      - name: Publish the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # A tag pushed with the Actions token starts no workflow by itself.
        run: gh workflow run publish.yml --ref "$VERSION"
