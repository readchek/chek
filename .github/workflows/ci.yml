name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libvips-dev libarchive-dev
          version: 1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx @redocly/cli@2.64.1 lint openapi.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its base parent, to list changed files.
          fetch-depth: 2
      # A release build in Docker takes minutes when any Rust code changes, and the
      # Rust job already checks the code, so pull requests build the image only
      # when the build inputs change. Pushes to main always build. The job still
      # reports success when it skips, so it can stay a required check.
      - name: Check for image changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = push ] \
            || git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|crates/[^/]+/(Cargo\.toml|build\.rs)|\.github/workflows/ci\.yml)$'; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile, dependency or workflow changes; skipping the image build."
          fi
      - uses: docker/setup-qemu-action@v3
        # Only pushes build arm64.
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          # arm64 builds under emulation are slow, so pull requests build amd64 only.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          # Pull requests load the amd64 image so the next step can start it.
          load: ${{ github.event_name != 'push' }}
          tags: chek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        if: github.event_name != 'push' && steps.changes.outputs.build == 'true'
        run: |
          docker run -d --name chek -p 8080:8080 chek:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs chek
          exit 1
