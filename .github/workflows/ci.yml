name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Main keeps every run, so each merge gets a finished build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reads debug info, and skipping it speeds up builds and shrinks the cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust
    # Runs on the maintainer's Linux server when the SELF_HOSTED_LINUX repository
    # variable is "true", and on GitHub's runners otherwise. Fork pull requests
    # always use GitHub's runners. See .github/RUNNERS.md.
    runs-on: ${{ vars.SELF_HOSTED_LINUX == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-linux"]') || 'ubuntu-latest' }}
    # On the server the job runs in the image the Dockerfile builds with, and
    # Docker volumes keep the registry, target directory and apt downloads
    # between runs, which is faster than restoring a cache from GitHub.
    container: ${{ vars.SELF_HOSTED_LINUX == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('{"image":"rust:1.97-slim-trixie","volumes":["chek-cargo-registry:/usr/local/cargo/registry","chek-cargo-target:/cargo-target","chek-apt-cache:/var/cache/apt","chek-apt-lists:/var/lib/apt/lists"]}') || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up the server's container
        if: runner.environment == 'self-hosted'
        run: |
          # Keep downloaded packages in the apt volumes, and refresh the package
          # lists at most daily, so most runs install without downloading.
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          packages="libvips-dev libarchive-dev pkg-config"
          if [ -z "$(find /var/lib/apt/lists -maxdepth 1 -name '*Packages*' -mmin -1440)" ]; then
            apt-get update
          fi
          apt-get install -y --no-install-recommends $packages \
            || { apt-get update && apt-get install -y --no-install-recommends $packages; }
          rustup component add rustfmt clippy
          echo CARGO_TARGET_DIR=/cargo-target >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.97
        if: runner.environment == 'github-hosted'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: awalsh128/cache-apt-pkgs-action@v1
        if: runner.environment == 'github-hosted'
        with:
          packages: libvips-dev libarchive-dev
          version: 1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bunx @redocly/cli@2.64.1 lint openapi.yaml

  docker:
    name: ${{ matrix.target == 'default' && 'Docker image' || 'Browser image' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [default, browser]
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request merge commit and its base parent, to list changed files.
          fetch-depth: 2
      # A release build in Docker takes minutes when any Rust code changes, and the
      # Rust job already checks the code, so pull requests build the image only
      # when the build inputs change. Pushes to main always build. The job still
      # reports success when it skips, so it can stay a required check.
      - name: Check for image changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = push ] \
            || git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(Dockerfile|\.dockerignore|deploy/server/.*|Cargo\.(toml|lock)|crates/[^/]+/(Cargo\.toml|build\.rs)|\.github/workflows/ci\.yml)$'; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile, dependency or workflow changes; skipping the image build."
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'
      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          target: ${{ matrix.target }}
          push: false
          # Load the image so the next step can start it.
          load: true
          tags: chek:ci
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=amd64-${{ matrix.target }}
          cache-to: type=gha,scope=amd64-${{ matrix.target }},mode=max
      - name: Start the image
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run -d --name chek -p 8080:8080 -e CHEK_CLOAK_DOWNLOAD=0 chek:ci
          for _ in $(seq 30); do
            if curl -fsS localhost:8080/health; then
              # The admin panel is bundled and its screens get its page.
              curl -fsS localhost:8080/admin/libraries | grep -q 'id="root"' && exit 0
              break
            fi
            sleep 1
          done
          docker logs chek
          exit 1

  # Builds natively on GitHub's arm64 runner, since building under emulation
  # took over half an hour. Only pushes to main build arm64.
  docker-arm64:
    name: ${{ matrix.target == 'default' && 'Docker image (arm64)' || 'Browser image (arm64)' }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [default, browser]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: chek:ci
          cache-from: |
            type=gha,scope=arm64
            type=gha,scope=arm64-${{ matrix.target }}
          cache-to: type=gha,scope=arm64-${{ matrix.target }},mode=max
      - name: Start the image
        run: |
          docker run -d --name chek -p 8080:8080 -e CHEK_CLOAK_DOWNLOAD=0 chek:ci
          for _ in $(seq 30); do
            if curl -fsS localhost:8080/health; then
              # The admin panel is bundled and its screens get its page.
              curl -fsS localhost:8080/admin/libraries | grep -q 'id="root"' && exit 0
              break
            fi
            sleep 1
          done
          docker logs chek
          exit 1
