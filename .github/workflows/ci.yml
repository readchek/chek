name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx @redocly/cli@2.64.1 lint openapi.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 builds under emulation are slow, so pull requests build amd64 only.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          # Pull requests load the amd64 image so the next step can start it.
          load: ${{ github.event_name != 'push' }}
          tags: chek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        if: github.event_name != 'push'
        run: |
          docker run -d --name chek -p 8080:8080 chek:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs chek
          exit 1
