# Source extensions for Chek, built to WebAssembly components with
# `./build.sh`. A workspace of its own: these crates target `wasm32-wasip2`,
# not the server.
[workspace]
resolver = "3"
members = ["sdk", "sources/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
chek-extension = { path = "sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
