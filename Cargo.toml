[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/readchek/chek"

[workspace.dependencies]
chek-catalog = { path = "crates/chek-catalog" }
chek-formats = { path = "crates/chek-formats" }
chek-komga = { path = "crates/chek-komga" }
chek-library = { path = "crates/chek-library" }
chek-sources = { path = "crates/chek-sources" }

argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
# Links the system libarchive, which reads RAR and 7-Zip comics.
compress-tools = { version = "0.16.1", default-features = false }
flate2 = "1.1.10"
getrandom = "0.4.3"
http-body-util = "0.1.5"
libvips = "2.3.0"
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry_sdk = "0.33.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
wasmtime = { version = "49.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p2"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep debug builds small: line tables for our code so backtraces stay useful,
# no debug info for dependencies. Cut the spike's debug build from 828 MB to 444 MB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
strip = "debuginfo"
