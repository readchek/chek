<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chek · Inspector</title>
    <link rel="stylesheet" href="/inspect/oat.css" />
    <link rel="stylesheet" href="/inspect/theme.css" />
    <script src="/inspect/oat.js" defer></script>
    <script src="/inspect/app.js" type="module"></script>
  </head>
  <body data-sidebar-layout>
    <header data-topnav>
      <button
        data-sidebar-toggle
        aria-label="Toggle navigation"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        ☰
      </button>
      <a class="unstyled" href="#library"><strong>Chek</strong></a>
      <span class="text-light">/ Inspector</span>
      <span id="connection" class="badge outline">Connecting</span>
    </header>
    <aside id="sidebar" data-sidebar>
      <nav aria-label="Inspector">
        <p class="text-light p-4">LIBRARY</p>
        <ul>
          <li><a href="#library">Imported books</a></li>
        </ul>
        <p class="text-light p-4">SOURCES</p>
        <ul id="source-nav"></ul>
        <ul>
          <li><a href="#sources">Manage sources</a></li>
        </ul>
        <p class="text-light p-4">SERVER</p>
        <ul>
          <li><a href="#jobs">Import jobs</a></li>
          <li><a href="#extensions">Extensions</a></li>
          <li><a href="#access">Server access</a></li>
        </ul>
      </nav>
      <footer><small class="text-light">Local development inspector</small></footer>
    </aside>
    <main id="main">
      <div class="container">
        <p id="notice" role="status" aria-live="polite" hidden></p>
        <div id="view" aria-busy="true"><p>Connecting to your library…</p></div>
      </div>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <header><h2 id="detail-title"></h2></header>
      <div id="detail-content"></div>
      <footer>
        <form method="dialog"><button class="outline">Close</button></form>
      </footer>
    </dialog>
  </body>
</html>
